services:
  backend:
    build: ./backend
    container_name: vendorcheck-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/qdrant_data:/app/qdrant_data
      - ./backend/uploads:/app/uploads
      - ./backend/audit_log.json:/app/audit_log.json
    restart: unless-stopped