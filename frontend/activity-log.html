<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Activity Log - VendorCheck AI Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.45s ease forwards; }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner { animation: spin 0.8s linear infinite; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 font-sans text-white flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col fixed h-screen">
    <div class="px-6 py-7 border-b border-slate-800">
      <div class="flex items-center gap-3">
        <svg viewBox="0 0 100 100" width="34" height="34">
          <path d="M50 5 L90 20 L90 50 Q90 80 50 95 Q10 80 10 50 L10 20 Z" fill="#f59e0b"/>
          <path d="M30 50 L45 65 L72 35" stroke="#0f172a" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <p class="font-bold text-base leading-tight">VendorCheck AI</p>
          <p class="text-[11px] text-amber-400 font-semibold tracking-widest uppercase leading-tight">Internal Admin</p>
        </div>
      </div>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-1">
      <a href="company-overview.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white text-sm font-medium transition">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg>
        Companies &amp; Employees
      </a>
      <a href="activity-log.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-slate-800 text-white text-sm font-medium">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        Activity Log
      </a>
    </nav>

    <div class="px-6 py-5 border-t border-slate-800">
      <p class="text-[11px] text-slate-500 leading-relaxed">Internal tool — not accessible from client dashboards.</p>
    </div>
  </aside>

  <!-- Main content -->
  <div class="ml-64 flex-1">
    <header class="bg-slate-900/60 backdrop-blur-md border-b border-slate-800 px-10 py-6 sticky top-0 z-40 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold">Activity Log</h1>
        <p class="text-sm text-slate-400 mt-1">Login, logout, and claim verification history with evidence</p>
      </div>
      <div class="flex items-center gap-2">
        <select id="actionFilter" class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
          <option value="">All actions</option>
          <option value="login">Login</option>
          <option value="logout">Logout</option>
          <option value="verify_claim">Claim Verification</option>
        </select>
      </div>
    </header>

    <main class="px-10 py-8 max-w-[1300px]">
      <div id="content">
        <div class="flex items-center justify-center py-24 text-slate-500 gap-2">
          <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><circle cx="12" cy="12" r="9" stroke-opacity="0.25"/><path d="M21 12a9 9 0 00-9-9"/></svg>
          <span>Loading activity...</span>
        </div>
      </div>
    </main>
  </div>

  <script>
    let allRecords = [];

    function actionBadge(action) {
      const map = {
        login: { label: "Login", cls: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
        logout: { label: "Logout", cls: "bg-red-500/10 text-red-400 border-red-500/20" },
        verify_claim: { label: "Claim Verification", cls: "bg-amber-500/10 text-amber-400 border-amber-500/20" },
      };
      const m = map[action] || { label: action, cls: "bg-slate-500/10 text-slate-400 border-slate-500/20" };
      return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${m.cls}">${m.label}</span>`;
    }

    function formatTime(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      return d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    }

    function initials(name) {
      return (name || "?").split(" ").map(n => n[0]).slice(0, 2).join("").toUpperCase();
    }

    function statusVerdictColor(statusLine) {
      if (!statusLine) return "text-slate-400";
      if (statusLine.includes("Strongly")) return "text-emerald-400";
      if (statusLine.includes("Partially")) return "text-yellow-400";
      if (statusLine.includes("Not Verified")) return "text-red-400";
      return "text-slate-400";
    }

    function fileChipsHTML(record) {
      const files = record.source_files || [];
      const names = record.source_names || [];
      if (files.length === 0 && names.length === 0) return "";

      const nameChips = names.map(n => `
        <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs bg-slate-800 border border-slate-700 text-slate-300">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0112 0v1"/></svg>
          ${n}
        </span>`).join("");

      const fileChips = files.map(f => `
        <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs bg-slate-800 border border-slate-700 text-slate-300">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
          ${f}
        </span>`).join("");

      return `<div class="flex flex-wrap gap-2 mt-2">${nameChips}${fileChips}</div>`;
    }

    function recordRowHTML(record) {
      const isVerify = record.action === "verify_claim";
      const isLogin = record.action === "login";

      let detailHTML = "";
      if (isVerify) {
        detailHTML = `
          <div class="mt-2 bg-slate-950/60 border border-slate-800 rounded-lg p-3">
            <p class="text-xs text-slate-500 mb-1">Claim submitted:</p>
            <p class="text-sm text-slate-200 mb-2">"${record.claim || ""}"</p>
            <p class="text-xs font-semibold ${statusVerdictColor(record.result_status)} mb-1">${(record.result_status || "").replace("STATUS:", "").trim()}</p>
            <p class="text-[11px] text-slate-500 mb-1">Checked against:</p>
            ${fileChipsHTML(record)}
          </div>`;
      } else if (isLogin) {
        detailHTML = `<p class="text-xs text-slate-500 mt-1">Company: ${record.company_code || "—"} · Role: ${record.role || "—"}</p>`;
      }

      return `
        <div class="fade-up bg-slate-900 border border-slate-800 rounded-xl p-5 mb-4" style="opacity:0;">
          <div class="flex items-start justify-between gap-4">
            <div class="flex items-start gap-3">
              <div class="w-9 h-9 rounded-full bg-slate-700 flex items-center justify-center text-xs font-semibold text-slate-300 flex-shrink-0">
                ${initials(record.performed_by)}
              </div>
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <p class="text-sm font-medium text-slate-100">${record.performed_by || "Unknown"}</p>
                  ${actionBadge(record.action)}
                </div>
                <p class="text-xs text-slate-500 font-mono">${record.employee_id || ""}</p>
                ${detailHTML}
              </div>
            </div>
            <span class="text-xs text-slate-500 whitespace-nowrap">${formatTime(record.timestamp)}</span>
          </div>
        </div>`;
    }

    function render() {
      const filter = document.getElementById("actionFilter").value;
      const content = document.getElementById("content");
      const filtered = filter ? allRecords.filter(r => r.action === filter) : allRecords;

      if (filtered.length === 0) {
        content.innerHTML = `<div class="text-center py-24 text-slate-500">No activity recorded yet.</div>`;
        return;
      }

      content.innerHTML = filtered.map(recordRowHTML).join("");
      setTimeout(() => {
        document.querySelectorAll('.fade-up').forEach(el => el.style.opacity = '1');
      }, 30);
    }

    async function loadActivity() {
      const content = document.getElementById("content");
      try {
        // Login/logout history
        const loginRes = await fetch("http://127.0.0.1:8000/api/v1/login-history");
        const loginData = await loginRes.json();

        // Full audit log (includes verify_claim, send_verification_email, employee_sync)
        const auditRes = await fetch("http://127.0.0.1:8000/audit-log");
        const auditData = await auditRes.json();

        const verifyRecords = (auditData.records || []).filter(r => r.action === "verify_claim");
        const loginRecords = loginData.records || [];

        allRecords = [...loginRecords, ...verifyRecords].sort(
          (a, b) => new Date(b.timestamp) - new Date(a.timestamp)
        );

        render();
      } catch (err) {
        content.innerHTML = `<div class="bg-red-500/10 border border-red-500/30 rounded-lg p-6 text-sm text-red-300 text-center">Failed to load activity log. Check backend server.</div>`;
      }
    }

    document.getElementById("actionFilter").addEventListener("change", render);
    loadActivity();
  </script>
</body>
</html>
