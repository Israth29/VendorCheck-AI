<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Sent Emails - VendorCheck AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.45s ease forwards; }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner { animation: spin 0.8s linear infinite; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 font-sans text-white">

  <div class="h-1 bg-gradient-to-r from-teal-500 via-indigo-500 to-amber-500"></div>

  <!-- Top Navbar -->
  <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 px-10 py-6 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <svg viewBox="0 0 100 100" width="48" height="48">
        <path d="M50 5 L90 20 L90 50 Q90 80 50 95 Q10 80 10 50 L10 20 Z" fill="#fbbf24"/>
        <path d="M30 50 L45 65 L72 35" stroke="#0f172a" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1 class="font-bold text-2xl leading-tight">My Sent Emails</h1>
        <p class="text-base text-slate-400 leading-tight">Verification emails you've sent, with delivery status</p>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <span class="text-sm text-slate-400" id="welcomeMsg"></span>
      <a id="backLink" href="hr-dashboard.html"
        class="px-5 py-2.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-sm font-medium transition">← Back to Dashboard</a>
    </div>
  </nav>

  <main class="w-full px-8 py-12 max-w-[1200px] mx-auto">
    <div id="content">
      <div class="flex items-center justify-center py-24 text-slate-500 gap-2">
        <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><circle cx="12" cy="12" r="9" stroke-opacity="0.25"/><path d="M21 12a9 9 0 00-9-9"/></svg>
        <span>Loading your sent emails...</span>
      </div>
    </div>
  </main>

  <script>
    const name = localStorage.getItem("userName");
    const role = localStorage.getItem("userRole");
    const employeeId = localStorage.getItem("userEmployeeId");

    document.getElementById("welcomeMsg").innerText = name ? `Signed in as ${name}` : "";
    document.getElementById("backLink").href = role === "procurement" ? "procurement-dashboard.html" : "hr-dashboard.html";

    function statusBadge(status) {
      return status === "sent"
        ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Sent</span>`
        : `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-red-500/10 text-red-400 border border-red-500/20"><span class="w-1.5 h-1.5 rounded-full bg-red-400"></span>Failed</span>`;
    }

    function sourceBadge(source) {
      if (source === "registered") return `<span class="text-[11px] text-slate-500">Registered company</span>`;
      if (source === "web_search_ai") return `<span class="text-[11px] text-slate-500">Email found via AI search</span>`;
      return "";
    }

    function formatTime(ts) {
      if (!ts) return "";
      return new Date(ts).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    }

    function recipientRowHTML(r) {
      return `
        <div class="flex items-center justify-between py-2.5 border-b border-slate-800 last:border-0">
          <div>
            <p class="text-sm text-slate-200">${r.company_name} <span class="text-slate-500">— ${r.email}</span></p>
            ${sourceBadge(r.source)}
            ${r.status === "failed" && r.error ? `<p class="text-xs text-red-400 mt-0.5">${r.error}</p>` : ""}
          </div>
          ${statusBadge(r.status)}
        </div>`;
    }

    function threadCardHTML(thread, index) {
      const recipients = thread.recipients || [];
      return `
        <div class="fade-up bg-slate-800/60 backdrop-blur-md border border-slate-700/50 rounded-2xl p-6 mb-5" style="animation-delay: ${index * 0.05}s; opacity:0;">
          <div class="flex items-start justify-between mb-3">
            <div>
              <h2 class="font-semibold text-base">${thread.subject}</h2>
              <p class="text-xs text-slate-500 mt-0.5">Candidate/Supplier: ${thread.candidate_name || "—"}</p>
            </div>
            <span class="text-xs text-slate-500 whitespace-nowrap">${formatTime(thread.timestamp)}</span>
          </div>
          <div class="bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-1">
            ${recipients.map(recipientRowHTML).join("")}
          </div>
        </div>`;
    }

    async function loadMySentEmails() {
      const content = document.getElementById("content");

      if (!employeeId) {
        content.innerHTML = `<div class="text-center py-24 text-slate-500">Please log in again to view your sent emails.</div>`;
        return;
      }

      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1/my-sent-emails?employee_id=${encodeURIComponent(employeeId)}`);
        const data = await response.json();
        const threads = data.threads || [];

        if (threads.length === 0) {
          content.innerHTML = `<div class="text-center py-24 text-slate-500">You haven't sent any verification emails yet.</div>`;
          return;
        }

        content.innerHTML = threads.map((t, i) => threadCardHTML(t, i)).join("");
        setTimeout(() => {
          document.querySelectorAll('.fade-up').forEach(el => el.style.opacity = '1');
        }, 30);
      } catch (err) {
        content.innerHTML = `<div class="bg-red-500/10 border border-red-500/30 rounded-lg p-6 text-sm text-red-300 text-center">Failed to load sent emails. Check backend server.</div>`;
      }
    }

    loadMySentEmails();
  </script>
</body>
</html>
